name: CI

# Проверка сборки на PR и пушах в main.
# Деплой делает сам Timeweb App Platform: на каждый пуш в main он запускает
# `python3 build.py` и раздаёт dist/ (настройки приложения — репозиторий Ad-Reach/infra).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Check output
        run: |
          test -f dist/index.html
          echo "files: $(find dist -type f | wc -l)"

      - name: Check live site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          sleep 120
          curl -sS -o /dev/null -w "https://centro-plus.ru -> %{http_code}\n" --max-time 30 https://centro-plus.ru/ || echo "centro-plus.ru ещё не направлен на App Platform"
