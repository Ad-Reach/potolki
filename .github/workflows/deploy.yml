name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HOST: 31.77.10.198

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 build.py

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts

      - name: Upload and publish
        env:
          REL: ${{ github.sha }}
        run: |
          set -euo pipefail
          tar -C dist -czf - . | ssh deploy@$HOST "set -e
            rm -rf /srv/centro-plus/releases/$REL && mkdir -p /srv/centro-plus/releases/$REL
            tar -xzf - -C /srv/centro-plus/releases/$REL"
          ssh deploy@$HOST 'bash -s' "$REL" < deploy/server-setup.sh

      - name: Check site
        run: |
          sleep 3
          curl -sS -o /dev/null -w "https://centro-plus.ru -> %{http_code}\n" --max-time 30 https://centro-plus.ru/ || echo "HTTPS not ready yet (DNS or certificate) — see Caddy logs"
