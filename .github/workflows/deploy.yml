name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 build.py

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload and publish
        env:
          SSHPASS: ${{ secrets.VDS_PASSWORD }}
          HOST: ${{ secrets.VDS_HOST }}
          USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o PubkeyAuthentication=no ${USER}@${HOST}"
          echo "DNS centro-plus.ru -> $(getent hosts centro-plus.ru || echo 'not resolved')"
          tar -C dist -czf - . | $SSH 'rm -rf /var/www/centro-plus.new && mkdir -p /var/www/centro-plus.new && tar -xzf - -C /var/www/centro-plus.new'
          $SSH 'bash -s' < deploy/server-setup.sh

      - name: Check site
        run: |
          sleep 5
          curl -sS -o /dev/null -w "https://centro-plus.ru -> %{http_code}\n" --max-time 30 https://centro-plus.ru/ || echo "HTTPS not ready yet (DNS or certificate) — see Caddy logs"
