name: Deploy

# Собирает сайт и кладёт готовый dist/ в ветку deploy (одним коммитом, без истории).
# App Platform (centro-plus.ru) берёт сайт из ветки deploy и ничего не собирает сам:
# так выкладка занимает секунды, а не минуты с установкой Python на каждой сборке.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Check output
        run: test -f dist/index.html && test -f dist/css/style.css
      - name: Publish to branch deploy
        run: |
          set -e
          mkdir /tmp/out && cp -r dist /tmp/out/dist
          cd /tmp/out
          printf 'Готовый сайт centro-plus.ru, собран из %s.\nНе редактировать: ветку перезаписывает workflow Deploy.\n' "$GITHUB_SHA" > README.md
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сборка ${GITHUB_SHA::7}: ${{ github.event.head_commit.message && 'main' || 'ручной запуск' }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy:deploy
